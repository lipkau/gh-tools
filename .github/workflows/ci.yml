name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - run: npm run audit

      - run: npm run lint

      - run: npm run type-check

      - run: npm run build

      - run: npm test

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Uncommitted changes detected after build:"
            git status --porcelain
            git diff
            echo ""
            echo "Please run 'npm run build' and commit the changes."
            exit 1
          else
            echo "✅ No uncommitted changes detected"
          fi

  # The only check the main branch ruleset requires. Add every new job to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
